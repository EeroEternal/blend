[workspace]
resolver = "2"
members = ["crates/ft-cli", "crates/ft-server", "crates/ft-bench", "crates/ft-moe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/EeroEternal/blend"

[workspace.dependencies]
ft-moe = { path = "crates/ft-moe" }
ft-bench = { path = "crates/ft-bench" }
ft-server = { path = "crates/ft-server" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[profile.release]
lto = "thin"
codegen-units = 1
